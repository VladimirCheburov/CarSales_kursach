{% extends "base.html" %}
{% load socialaccount %}
{% block title %}Войти{% endblock %}

{% block content %}
<style>
    body {
        background-image: url('https://avatars.mds.yandex.net/i?id=392af27c4f535b3f66e87610af2674fc_l-8000127-images-thumbs&n=13');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }
    .login-container {
        max-width: 500px;
        margin: 4rem auto;
        padding: 2rem;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .login-title {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 2rem;
        color: var(--dark);
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--gray);
    }
    .form-control {
        width: 100%;
        padding: 0.8rem 1rem;
        font-size: 1rem;
        border: 1px solid var(--light-gray);
        border-radius: 8px;
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-control:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    .btn-submit {
        width: 100%;
        padding: 1rem;
        font-size: 1.1rem;
        font-weight: 700;
        color: white;
        background-color: var(--primary);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .btn-submit:hover {
        background-color: var(--primary-dark);
    }
    .extra-links {
        display: flex;
        justify-content: space-between;
        margin-top: 1.5rem;
    }
    .extra-links a {
        color: var(--primary);
        text-decoration: none;
        font-size: 0.9rem;
    }
    .social-login {
        text-align: center;
        margin-top: 2rem;
    }
    .social-login h5 {
        margin-bottom: 1rem;
        color: var(--gray);
    }
    .btn-google {
        background-color: #db4437;
        color: white;
    }
    .btn-google:hover {
        background-color: #c33d2e;
    }
</style>

<div class="login-container">
    <h1 class="login-title">Войти</h1>
    <form method="post" action="{% url 'account_login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username" class="form-label">Имя пользователя:</label>
            <input type="text" name="login" id="id_username" class="form-control">
        </div>
        <div class="form-group">
            <label for="id_password" class="form-label">Пароль:</label>
            <input type="password" name="password" id="id_password" class="form-control">
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" name="remember" id="id_remember" class="form-check-input">
            <label for="id_remember" class="form-check-label">Запомнить меня</label>
        </div>
        <button type="submit" class="btn-submit">Войти</button>
    </form>
    <div class="extra-links">
        <a href="{% url 'account_signup' %}">Зарегистрироваться</a>
        <a href="{% url 'account_reset_password' %}">Забыли пароль?</a>
    </div>
    <div class="social-login">
        <h5>Или используйте сторонний сервис:</h5>
        <a href="{% provider_login_url 'google' %}" class="btn btn-google">Войти через Google</a>
    </div>
</div>
{% endblock %}
